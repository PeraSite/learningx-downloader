name: Release extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Manual runs on another branch must not cancel a main release.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize isolated temporary paths
        run: |
          printf 'TEST_OUTPUT_DIR=%s/learningx-e2e\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RELEASE_ASSET_DIR=%s/learningx-release\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out this exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install Ubuntu media and archive tools
        timeout-minutes: 5
        run: |
          set -euo pipefail
          missing=()
          for tool in ffmpeg ffprobe openssl zip unzip; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              package="$tool"
              if [[ "$tool" == ffprobe ]]; then package=ffmpeg; fi
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} )); then
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install --yes --no-install-recommends "${missing[@]}"
          else
            echo 'All media/archive tools are already installed; skipping apt.'
          fi
          ffmpeg -version
          ffprobe -version
          /usr/bin/openssl version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

      - name: Build and package the extension
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bun run build

      - name: Stage the ZIP and test its extracted contents
        id: package
        run: |
          set -euo pipefail
          version="$(bun -e 'const { version } = await Bun.file("manifest.json").json(); if (typeof version !== "string" || !/^\d+(?:\.\d+){0,3}$/.test(version)) throw new Error("Invalid manifest version"); process.stdout.write(version);')"
          # Repackage only: preserve the built payload, adding commit provenance.
          bun -e 'await Bun.write("dist/BUILD_INFO.json", JSON.stringify({ GITHUB_SHA: process.env.GITHUB_SHA, GITHUB_RUN_ID: process.env.GITHUB_RUN_ID, GITHUB_RUN_NUMBER: process.env.GITHUB_RUN_NUMBER, builtAt: new Date().toISOString() }, null, 2) + "\n");'
          bun run package
          archive="release/learningx-video-extension-${version}.zip"
          test -s "$archive"
          mkdir -p "$RELEASE_ASSET_DIR"
          cp -- "$archive" "$RELEASE_ASSET_DIR/learningx-video-extension.zip"
          unzip -tq "$RELEASE_ASSET_DIR/learningx-video-extension.zip"
          # E2E loads dist, so replace it with the actual release payload.
          rm -rf -- dist
          mkdir dist
          unzip -q "$RELEASE_ASSET_DIR/learningx-video-extension.zip" -d dist
          bun -e 'const source = await Bun.file("manifest.json").json(); const packed = await Bun.file("dist/manifest.json").json(); const info = await Bun.file("dist/BUILD_INFO.json").json(); if (packed.version !== source.version || info.GITHUB_SHA !== process.env.GITHUB_SHA) throw new Error("Packaged manifest or commit mismatch");'
          (cd "$RELEASE_ASSET_DIR" && sha256sum learningx-video-extension.zip > SHA256SUMS.txt)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=build-%s-%s\n' "$GITHUB_RUN_NUMBER" "${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Install real Playwright Chromium
        timeout-minutes: 5
        run: bun x playwright install --with-deps chromium --no-shell

      - name: Run browser E2E against the release payload
        run: bun run test:e2e

      - name: Publish the tested private release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_PROMPT_DISABLED: '1'
          VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          # Releases inherit repository visibility; never change repo settings.
          test "$(gh api "repos/$GH_REPO" --jq '.private')" = true
          # Also protects against manually rerunning an older successful build.
          ensure_current_main() {
            local main_sha
            main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" || exit 1
            if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
              echo '::notice::A newer main commit exists; skipping release publication.'
              exit 0
            fi
          }
          ensure_current_main
          cd "$RELEASE_ASSET_DIR"
          sha256sum --check SHA256SUMS.txt
          notes="$RUNNER_TEMP/learningx-release-notes.md"
          cat > "$notes" <<'NOTES'
          ## 설치 방법
          1. `learningx-video-extension.zip`을 다운로드하고 압축을 풉니다.
          2. Chrome에서 `chrome://extensions`를 열고 개발자 모드를 켭니다.
          3. '압축해제된 확장 프로그램을 로드합니다'를 눌러 `manifest.json`이 있는 압축 해제 폴더를 선택합니다.

          비공개 저장소이므로 접근 권한이 있는 GitHub 계정으로 로그인해야 다운로드할 수 있습니다.
          Chrome 웹 스토어 배포가 아니므로 자동 설치·업데이트되지 않습니다. 새 버전도 직접 다운로드해 적용하세요.
          `SHA256SUMS.txt`로 ZIP의 SHA-256을 확인할 수 있습니다. 단위 테스트와 실제 Chromium 브라우저 E2E를 통과한 ZIP입니다.
          NOTES
          printf '\n버전: %s\n커밋: %s\n' "$VERSION" "$GITHUB_SHA" >> "$notes"
          title="LearningX 영상 다운로더 ${VERSION} (${TAG})"
          # The run number and SHA stay identical across reruns. Recover partial
          # drafts, and hide published assets before replacing them on a rerun.
          if state="$(gh release view "$TAG" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv' 2>/dev/null)"; then
            IFS=$'\t' read -r is_draft target <<< "$state"
            if [[ "$is_draft" == true ]]; then
              # A failed first upload can leave a draft with no git tag yet.
              test "$target" = "$GITHUB_SHA"
            else
              tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')"
              test "$tag_sha" = "$GITHUB_SHA"
            fi
            ensure_current_main
            if [[ "$is_draft" != true ]]; then
              gh release edit "$TAG" --draft=true
            fi
            gh release upload "$TAG" learningx-video-extension.zip SHA256SUMS.txt --clobber
            ensure_current_main
            gh release edit "$TAG" --draft=false --target "$GITHUB_SHA" \
              --title "$title" --notes-file "$notes" --latest
          else
            ensure_current_main
            # gh creates a draft, uploads both assets, then publishes it.
            gh release create "$TAG" learningx-video-extension.zip SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" --latest
          fi

      # Fixtures include a synthetic private key, videos, and browser profiles.
      # Never upload the test directory, even when a test fails.
      - name: Remove private test fixtures
        if: always()
        run: rm -rf -- "$TEST_OUTPUT_DIR"
